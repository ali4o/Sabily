<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تخصيص المخرجات — سبيلي</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101619;--primary:#1E6F5C;--primary-soft:#E4EFEB;--primary-deep:#14483C;--paper:#F2F4F3;--surface:#fff;--line:#DDE3E1;--text:#101619;--text-2:#5A6663;--text-3:#8A9490;--danger:#9B3A2F;--radius:14px}
:root[data-theme="dark"]{--paper:#0D1214;--surface:#141B1E;--line:#26312F;--text:#E8EDEB;--text-2:#9AA6A2;--text-3:#6C7874;--primary:#3F9B83;--primary-soft:#16302A;--primary-deep:#8FD1BE}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:Cairo,system-ui,sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.mark b{font-size:24px;font-weight:700}
.topnav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line)}
.topnav a{font-size:13px;color:var(--text-2);text-decoration:none;border:1px solid transparent;border-radius:8px;padding:5px 12px}
.topnav a:hover{color:var(--text);border-color:var(--line)}
.topnav a.on{color:var(--primary-deep);border-color:var(--primary);background:var(--primary-soft)}
h1{font-size:22px;margin:26px 0 4px}.sub{color:var(--text-2);font-size:13.5px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.f{display:grid;gap:12px}
label{font-size:13px;color:var(--text-2);display:block;margin-bottom:4px}
input[type=text],input[type=number],select{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%}
input[type=range]{width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer}
.grid6{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.grid6 button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--text-2);font:inherit}
.grid6 button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.logoPrev{max-width:220px;background:#000;border-radius:10px;padding:10px}
.logoPrev img{width:100%;display:block}
button.go{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:11px 26px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 18px;font:inherit;color:var(--text-2);cursor:pointer}
.banner{display:none;background:#FFF4E0;border:1px solid #E0B25C;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px}
#toast{position:sticky;bottom:18px;margin:0 auto;width:max-content;background:var(--ink);color:#F2F4F3;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.foot{padding-bottom:50px}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="mark"><b>سبيلي</b></div><a href="/" style="font-size:13px">→ الرئيسية</a></div></header>
<nav class="wrap topnav">
  <a href="/">الرئيسية</a><a href="/static/appearance.html" class="on">تخصيص المخرجات</a>
  <a href="/static/stats.html">الإحصائيات</a><a href="/static/settings.html">الإعدادات</a>
  <a href="/static/video-mockup.html">المعاينة</a>
</nav>
<main class="wrap">
  <h1>تخصيص المخرجات</h1>
  <p class="sub">القيم الافتراضية لكل مهمة جديدة. تُحفظ في <code dir="ltr">.env</code> وتُطبق بعد إعادة التشغيل. عاين الشكل في <a href="/static/video-mockup.html">صفحة المعاينة</a>.</p>
  <div class="banner" id="banner">حُفظت القيم — أعد التشغيل لتُطبق: <button class="ghost" id="reboot" style="margin-inline-start:10px">↻ إعادة التشغيل</button></div>
  <div class="card"><h2>الجودة</h2><div class="f" id="fQuality"></div></div>
  <div class="card"><h2>الشعار</h2>
    <div class="logoPrev"><img src="/brand/sabily-logo.png" alt="شعار سبيلي" onerror="this.parentElement.textContent='لا توجد صورة — سيُستخدم النص'"></div>
    <div class="f" id="fBrand" style="margin-top:12px"></div>
  </div>
  <div class="card"><h2>الهاشتاق</h2><div class="f" id="fTag"></div></div>
  <div class="card"><h2>الترجمة والنص</h2><div class="f" id="fSubs"></div></div>
  <div class="foot"><button class="go" id="save">حفظ</button></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const api=(u,o)=>fetch(u,o).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e.detail||r.status)));
const POS=['tl','tc','tr','bl','bc','br'];
const LAYOUT={QUALITY:'fQuality',ASPECT:'fQuality',CLIPS_PER_VIDEO:'fQuality',BRAND_WATERMARK:'fBrand',BRAND_TEXT:'fBrand',BRAND_POS:'fBrand',BRAND_LOGO_SCALE:'fBrand',SOURCE_TAG:'fTag',SOURCE_POS:'fTag',BURN_SUBTITLES:'fSubs',SUBTITLE_FONT:'fSubs',CAPTION_LANG:'fSubs'};
let META={},VAL={};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove('on'),2600);}
function ctl(key,m,v){
  if(key.endsWith('_POS'))return `<label>${m.label}</label><div class="grid6" data-pos="${key}">`+POS.map(p=>`<button type="button" data-p="${p}" class="${v===p?'on':''}">${p}</button>`).join('')+`</div>`;
  if(m.type==='bool')return `<label class="chk"><input type="checkbox" data-k="${key}" ${v==='true'?'checked':''}> ${m.label}</label>`;
  if(m.type==='enum')return `<label>${m.label}</label><select data-k="${key}">`+m.options.map(o=>`<option value="${o}" ${v===o?'selected':''}>${o||'—'}</option>`).join('')+`</select>`;
  if(m.type==='int'||m.type==='float')return `<label>${m.label}</label><input type="number" step="any" data-k="${key}" value="${v}">`;
  return `<label>${m.label}</label><input type="text" data-k="${key}" value="${(v||'').replace(/"/g,'&quot;')}">`;
}
async function load(){
  const d=await api('/api/settings');META=d.keys;
  for(const[k,m]of Object.entries(META)){if(!(k in LAYOUT))continue;VAL[k]=m.value;
    document.getElementById(LAYOUT[k]).insertAdjacentHTML('beforeend',ctl(k,m,m.value));}
  document.querySelectorAll('[data-pos]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    [...g.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');g.dataset.v=b.dataset.p;});
}
$('#save').onclick=async()=>{
  const body={};
  document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
    const v=el.type==='checkbox'?(el.checked?'true':'false'):el.value;
    if(v!==VAL[k])body[k]=v;});
  document.querySelectorAll('[data-pos]').forEach(g=>{if(g.dataset.v)body[g.dataset.pos]=g.dataset.v;});
  if(!Object.keys(body).length){toast('لا تغييرات');return;}
  try{const r=await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('حُفظ: '+r.saved.join('، '));$('#banner').style.display='block';Object.assign(VAL,body);}catch(e){toast(String(e));}
};
$('#reboot').onclick=async()=>{if(!confirm('إعادة تشغيل السيرفر؟'))return;
  try{await api('/api/server/restart',{method:'POST'});toast('جارٍ إعادة التشغيل…');}catch(e){toast(String(e));}};
const saved=localStorage.getItem('sabily-theme');
if(saved==='dark'||(!saved&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';
load().catch(e=>toast(String(e)));
</script>
</body>
</html>
